name: bounty-job-worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional accepted bounty job ID"
        required: false
        type: string
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bounty-state
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"

      - name: Process accepted jobs
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python worker.py

      - name: Commit job memory and artifacts
        if: always()
        run: |
          git config user.name "bounty-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f jobs.json ]; then
            git add jobs.json
          fi

          if [ -d job-artifacts ]; then
            git add job-artifacts/
          fi

          if git diff --cached --quiet; then
            echo "No worker changes to commit."
            exit 0
          fi

          git commit -m "job: process accepted bounty"

          for attempt in 1 2 3 4 5; do
            if git push origin "${GITHUB_REF_NAME}"; then
              echo "Worker changes pushed successfully."
              exit 0
            fi

            echo "Push failed; refreshing branch before retry $attempt..."
            git fetch origin "${GITHUB_REF_NAME}"
            git merge origin/"${GITHUB_REF_NAME}" -X ours --no-edit || git merge --abort
            sleep 2
          done

          echo "Could not push worker changes after multiple attempts."
          exit 1