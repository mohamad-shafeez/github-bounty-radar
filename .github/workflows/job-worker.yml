name: bounty-job-worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional accepted bounty job ID"
        required: false
        type: string
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bounty-state
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"

      - name: Process accepted jobs
        env:
          JOB_ID: ${{ inputs.job_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python worker.py

      - name: Commit job memory and artifacts
        run: |
          git config user.name "bounty-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if [ -d job-artifacts ]; then
            git add job-artifacts/
          fi
          if git diff --cached --quiet; then
            echo "No worker changes to commit."
            exit 0
          fi
          git commit -m "job: process accepted bounty"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
