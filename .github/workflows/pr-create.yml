name: bounty-create-pr

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "PR_READY bounty job ID"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bounty-state
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Create PR
        env:
          JOB_ID: ${{ inputs.job_id }}
          CONTRIBUTOR_GITHUB_TOKEN: ${{ secrets.CONTRIBUTOR_GITHUB_TOKEN }}
        run: python pr_worker.py
      - name: Commit PR state
        run: |
          git config user.name "bounty-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json job-artifacts/
          git diff --cached --quiet && exit 0
          git commit -m "job: record opened PR" || exit 0
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
