name: bounty-maintainer-watch

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bounty-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Watch issue activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python maintainer_watch.py
      - name: Commit activity memory
        run: |
          git config user.name "bounty-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if [ -d job-artifacts ]; then
            git add job-artifacts/
          fi
          git diff --cached --quiet && exit 0
          git commit -m "job: record maintainer activity"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
