name: bounty-radar

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Only send a test notification to my phone (no GitHub scan)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: bounty-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"

      - name: Run bounty radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST_ALERT: ${{ inputs.send_test == true && '1' || '' }}
        run: python radar.py

      - name: Save radar state
        if: ${{ success() && inputs.send_test != true }}
        run: |
          if [ ! -f state.json ] && [ ! -f jobs.json ]; then
            echo "No state files were created. Nothing to commit."
            exit 0
          fi

          git config user.name "bounty-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json jobs.json

          if git diff --cached --quiet; then
            echo "No radar state changed. Nothing to commit."
            exit 0
          fi

          git commit -m "radar: update state"

          for attempt in 1 2 3 4 5; do
            if git push origin "${GITHUB_REF_NAME}"; then
              echo "Radar state saved and pushed successfully."
              exit 0
            fi

            echo "Push failed; refreshing branch before retry $attempt..."
            git fetch origin "${GITHUB_REF_NAME}"
            git merge origin/"${GITHUB_REF_NAME}" -X ours --no-edit || git merge --abort
            sleep 2
          done

          echo "Could not push state files after multiple attempts."
          exit 1